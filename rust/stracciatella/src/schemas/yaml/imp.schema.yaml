$schema: http://json-schema.org/draft-04/schema#
type: object
title: I.M.P.
description: This defines IMP specific settings for the game.
properties:
  activation_codes:
    type: array
    title: Activation codes
    description: A list of I.M.P. homepage activation codes that can be used to enter IMP. They are case-sensitive.
    items:
      type: string
  starting_level:
    $ref: types/uint8.schema.yaml
    title: Starting level
    description: The starting level of a created IMP merc.
  voices:
    type: array
    title: Voices
    description: |
      The voices an I.M.P. character can be offered, in the order the site shows them.

      A voice is a set of speech, dialogue text and battle sound files, all named after the merc profile they were recorded for. The voice picked is stored on the character's own profile, so any number of characters may share one.
    minItems: 1
    items:
      type: object
      title: Voice
      properties:
        gender:
          $ref: types/gender.schema.yaml
          title: Gender
          description: The gender this voice is offered for.
        profile:
          $ref: types/uint8.schema.yaml
          title: Profile
          description: The merc profile whose speech, dialogue text and battle sound files make up this voice.
      required:
      - gender
      - profile
  portraits:
    type: array
    title: Portraits
    description: The portraits an I.M.P. character can be offered, in the order the site shows them.
    minItems: 1
    items:
      type: object
      title: Portrait
      properties:
        gender:
          $ref: types/gender.schema.yaml
          title: Gender
          description: The gender this portrait is offered for.
        face:
          $ref: types/uint8.schema.yaml
          title: Face
          description: The face image, `FACES/<face>.sti`, with `FACES/bigfaces/<face>.sti` shown while picking.
        skin:
          type: string
          title: Skin colour
          description: The palette the character's skin is rendered with, for example `TANSKIN`.
        hair:
          type: string
          title: Hair colour
          description: The palette the character's hair is rendered with, for example `BROWNHEAD`.
        eyes:
          $ref: types/face-offset.schema.yaml
        mouth:
          $ref: types/face-offset.schema.yaml
        big_body:
          type: boolean
          title: Big body
          description: |
            Whether this portrait is a burly one, which is given the big male body when the character is strong enough to carry it.

            Defaults to `false`.
      required:
      - gender
      - face
      - skin
      - hair
      - eyes
      - mouth
  inventory:
    type: array
    title: Inventory
    description: The inventory of a created IMP merc.
    items:
      type: object
      title: Item condition set
      description: Data for when, where and what item to create.
      properties:
        items:
          title: List of the items to grant
          type: array
          items:
            $ref: types/id.schema.yaml
        slot:
          $ref: types/inv-slot.schema.yaml
          title: Inventory slot
          description: An optional slot to create the items in.
        conditions:
          title: Granting conditions
          description: Optional pairs of greater-or-equal conditions to evaluate whether the I.M.P. should get the items.
          type: array
          items:
            anyOf:
              - $ref: types/uint8.schema.yaml
              - type: string
    required:
    - items
required:
- activation_codes
- voices
- portraits
- inventory
